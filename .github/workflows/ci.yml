name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      # Includes the real-model Silero integration test — the model is
      # vendored at static/models/silero_vad_v5.onnx, so it runs in CI.
      - name: Unit and component tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # No GPU on runners: e2e covers the app shell, overlay, panels, and that
      # onnxruntime-web + the vendored Silero model load in the built app.
      # Real Whisper/translation inference stays manual (see README).
      - name: End-to-end tests
        run: npm run test:e2e
