name: Deploy to GitHub Pages

# The app is a fully static SPA (adapter-static, no server code), so hosting is
# just the build/ directory. Deploys on every push to main; CI runs the test
# suite on the same push, and PRs must be green before they land, so the deploy
# doesn't repeat the (docker-heavy) test job.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish so production is never
# left half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enablement flips the repo's Pages source to "GitHub Actions" on the
      # first run, so no manual Settings → Pages step is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Project sites are served from https://<owner>.github.io/<repo>/, so the
      # base path is the repo name (svelte.config.js normalizes the slashes).
      - name: Build
        run: BASE_PATH="${{ github.event.repository.name }}" bun run build

      # Pages has no rewrite rules: unknown paths get 404.html. Serving the
      # SPA fallback there keeps deep links rendering client-side (asset URLs
      # inside it are already BASE_PATH-absolute, so depth doesn't matter).
      - name: Use the SPA fallback as the Pages 404 page
        run: cp build/200.html build/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
